<!doctype html>
<html lang="en" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ped Phone Snatch</title>
</head>
<body style="background: transparent !important;">
    <main id="prompt" aria-hidden="true">
        <div class="pointer"></div>
        <section class="card">
            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img">
                    <path d="M8.25 2.75h7.5A2.25 2.25 0 0 1 18 5v14a2.25 2.25 0 0 1-2.25 2.25h-7.5A2.25 2.25 0 0 1 6 19V5a2.25 2.25 0 0 1 2.25-2.25Zm.25 3v11.5h7V5.75h-7Zm3.5 13a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8Z"/>
                </svg>
            </div>

            <div class="copy">
                <div class="eyebrow">
                    <span class="status-dot"></span>
                    <span>Opportunity</span>
                    <span class="distance" id="distance">1.2m</span>
                </div>
                <div class="title" id="title">Snatch phone</div>
                <div class="subtitle" id="subtitle">Take it before they notice</div>
            </div>

            <div class="key-group">
                <span class="key" id="key">E</span>
                <span class="press">PRESS</span>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
